name: kaoyan408-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaoyan408_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaoyan408_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
