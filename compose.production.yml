services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 2C2G tuning: limit PG memory footprint
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      QUESTION_IMPORT_PERMANENT_DIR: /question-import-data
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./deploy/tencent-ip/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      - type: volume
        source: question_import_data
        target: /question-import-data
        read_only: true
        volume:
          subpath: permanent
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://${PUBLIC_IP}}
      VITE_API_BASE_URL: "/api"
      ALLOW_DEMO_AUTH: "false"
      # G1.7 (owner decision A5 = APPROVED): the transfer re-test is a product
      # surface now, not a report-only experiment. Enabled explicitly here so it
      # does not depend on the host shell; the single-point parse still treats an
      # unset/unknown value as OFF, and MASTERY_SEMANTICS stays deliberately
      # absent so C1 remains OFF.
      # With no `transfer_probe_pool` content yet, the scheduler honestly reports
      # `no_probe_available` and the student card stays silent — it never falls
      # back to reusing an old question.
      TRANSFER_PROBE_ENABLED: ${TRANSFER_PROBE_ENABLED:-true}
      ALLOW_INSECURE_HTTP_IP: ${ALLOW_INSECURE_HTTP_IP:-true}
      AUDIT_LOG_RETENTION_DAYS: "90"
      QUESTION_IMPORT_DATA_DIR: /var/lib/kaoyan408/question-imports
      QUESTION_IMPORT_MAX_PDF_BYTES: ${QUESTION_IMPORT_MAX_PDF_BYTES:-524288000}
      QUESTION_IMPORT_MAX_PROVIDER_PAGES: ${QUESTION_IMPORT_MAX_PROVIDER_PAGES:-200}
      QUESTION_IMPORT_TEMPORARY_QUOTA_BYTES: ${QUESTION_IMPORT_TEMPORARY_QUOTA_BYTES:-10737418240}
      QUESTION_IMPORT_DISK_STOP_PERCENT: ${QUESTION_IMPORT_DISK_STOP_PERCENT:-80}
      QUESTION_IMPORT_WORKER_CONCURRENCY: "1"
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2000}
      # 2C2G: Node heap capped at 512MB (was 1536 — causes OOM on 2GB)
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - question_import_data:/var/lib/kaoyan408/question-imports
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  postgres_data:
  question_import_data: